<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job 04</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen text-gray-800 font-sans">

    <header class="bg-blue-700 text-white shadow-lg p-5">
        <nav class="container mx-auto flex justify-between items-center">
            <div class="text-2xl font-extrabold tracking-tight">
                La Plateforme
            </div>
            <ul class="flex space-x-6 font-medium">
                <li><a href="index.html" class="hover:text-indigo-200 transition-colors">Accueil</a></li>
            </ul>
        </nav>
    </header>

    <main class="flex-grow container mx-auto mt-12 mb-12 p-4 flex justify-center items-center">
        
        <section class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-xl border border-gray-100">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Créer un compte</h1>
            
            <form action="index.html" method="POST" class="space-y-6">
                
                <div class="flex items-center space-x-6 bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <span class="font-medium text-gray-700">Civilité :</span>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" id="mme" name="civilite" value="Mme" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="ml-2 text-gray-700">Mme</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="radio" id="m" name="civilite" value="M." class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                        <span class="ml-2 text-gray-700">M.</span>
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-regular fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="prenom" name="prenom" placeholder="Prénom" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-11 p-3 transition-colors shadow-sm">
                    </div>
                    
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-regular fa-id-badge text-gray-400"></i>
                        </div>
                        <input type="text" id="nom" name="nom" placeholder="Nom" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-11 p-3 transition-colors shadow-sm">
                    </div>
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                        <i class="fa-solid fa-location-dot text-gray-400"></i>
                    </div>
                    <input type="text" id="adresse" name="adresse" placeholder="Adresse complète" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-11 p-3 transition-colors shadow-sm">
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                        <i class="fa-regular fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" id="email" name="email" placeholder="Adresse email" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-11 p-3 transition-colors shadow-sm">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" name="password" placeholder="Mot de passe" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-11 p-3 transition-colors shadow-sm">
                    </div>
                    
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                            <i class="fa-solid fa-check-double text-gray-400"></i>
                        </div>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmer mot de passe" required class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-xl focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-11 p-3 transition-colors shadow-sm">
                    </div>
                </div>

                <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                    <p class="font-medium text-indigo-900 mb-3">Vos passions :</p>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center cursor-pointer hover:bg-indigo-100 p-2 rounded-lg transition-colors">
                            <input type="checkbox" id="informatique" name="passions" value="informatique" class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500">
                            <span class="ml-2 text-sm text-gray-700">Informatique</span>
                        </label>
                        <label class="flex items-center cursor-pointer hover:bg-indigo-100 p-2 rounded-lg transition-colors">
                            <input type="checkbox" id="voyages" name="passions" value="voyages" class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500">
                            <span class="ml-2 text-sm text-gray-700">Voyages</span>
                        </label>
                        <label class="flex items-center cursor-pointer hover:bg-indigo-100 p-2 rounded-lg transition-colors">
                            <input type="checkbox" id="sport" name="passions" value="sport" class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500">
                            <span class="ml-2 text-sm text-gray-700">Sport</span>
                        </label>
                        <label class="flex items-center cursor-pointer hover:bg-indigo-100 p-2 rounded-lg transition-colors">
                            <input type="checkbox" id="lecture" name="passions" value="lecture" class="w-4 h-4 text-indigo-600 bg-gray-100 border-gray-300 rounded focus:ring-indigo-500">
                            <span class="ml-2 text-sm text-gray-700">Lecture</span>
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:outline-none focus:ring-indigo-300 font-medium rounded-xl text-sm px-5 py-3.5 text-center shadow-lg transition-transform transform hover:-translate-y-0.5">
                    Valider l'inscription
                </button>

            </form>
        </section>
    </main>

    <footer class="bg-gray-800 text-gray-300 py-8 mt-auto border-t-4 border-indigo-600">
        <div class="container mx-auto px-4">
            <ul class="flex flex-col md:flex-row justify-center items-center space-y-4 md:space-y-0 md:space-x-12 font-medium">
                <li><a href="index.html" class="hover:text-white transition-colors"><i class="fa-solid fa-house mr-2"></i>Accueil</a></li>
                <li><a href="index.html" class="hover:text-white transition-colors"><i class="fa-solid fa-user-plus mr-2"></i>Inscription</a></li>
                <li><a href="index.html" class="hover:text-white transition-colors"><i class="fa-solid fa-right-to-bracket mr-2"></i>Connexion</a></li>
                <li><a href="index.html" class="hover:text-white transition-colors"><i class="fa-solid fa-magnifying-glass mr-2"></i>Rechercher</a></li>
            </ul>
            <div class="text-center mt-6 text-sm text-gray-500">
                &copy; 2026 La Plateforme
            </div>
        </div>
    </footer>

</body>
</html>
