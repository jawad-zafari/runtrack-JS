<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job 03 - Grid Final</title>
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
</script>

    <style>
        body { padding: 20px; }

        .my-block {
            width: 100%;
            margin-bottom: 10px; 
        }

        .h-teal { min-height: 150px; }
        .h-blue { min-height: 200px; } 
        .h-purple { min-height: 100px; } 
        .h-orange { min-height: 40px; } 
        .bg-teal { background-color: #87CEEB; }
        .bg-blue { background-color: #8DA2FB; }
        .bg-purple { background-color: #C792EA; }
        .bg-orange { background-color: #F4B084; }
    </style>
</head>
<body>

    <div class="container-fluid">
        
        <div class="row mb-2">
            <div class="col-12">
                <div class="my-block bg-teal h-teal"></div>
            </div>
        </div>

        <div class="row mb-2 g-3">
            <div class="col-12 col-md-4">
                <div class="my-block bg-blue h-blue"></div>
            </div>
            <div class="col-6 col-md-4">
                <div class="my-block bg-blue h-blue"></div>
            </div>
            <div class="col-6 col-md-4">
                <div class="my-block bg-blue h-blue"></div>
            </div>
        </div>

        <div class="row mb-2 g-3">
            
            <div class="col-4 offset-4 col-md-6 offset-md-0">
                <div class="my-block bg-purple h-purple"></div>
            </div>

            <div class="col-8 offset-2 col-md-6 offset-md-0">
                <div class="my-block bg-purple h-purple"></div>
            </div>
        </div>

        <div class="row align-items-start justify-content-between mt-4">
            
            <div class="col-4 col-lg-3 mt-lg-3">
                <div class="my-block bg-orange h-orange"></div>
            </div>
            
            <div class="col-4 col-lg-3 mt-lg-4">
                <div class="my-block bg-orange h-orange"></div>
            </div>
            
            <div class="col-4 col-lg-3 mt-lg-5 pt-lg-4">
                <div class="my-block bg-orange h-orange"></div>
            </div>

        </div>

    </div>

</body>
</html>
